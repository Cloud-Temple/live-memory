[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-memory"
dynamic = ["version"]
requires-python = ">=3.11"
# LM2-26 fix : bornes basses remontées pour exclure les versions vulnérables
# connues. uv.lock épingle les versions exactes ; ces bornes protègent les
# builds `pip install live-memory` sans uv.lock (CVE-2026-32871 sur mcp<1.27).
# LM2-27 fix : httpx-sse retiré (introuvable dans le code source, surface
# d'attaque inutile depuis la migration Streamable HTTP).
dependencies = [
    "mcp[cli]>=1.27.0",       # CVE-2026-32871 path traversal — fixé en 1.27
    "uvicorn>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.28",
    "boto3>=1.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Restreint le collect pytest au répertoire officiel `tests/`.
# Les scripts utilitaires (`scripts/test_*.py`, `chantier/test_*.py`)
# sont des outils E2E manuels ou des reliques historiques — ils
# ne doivent pas faire échouer la CI.
testpaths = ["tests"]
