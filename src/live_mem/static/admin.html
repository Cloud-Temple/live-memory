<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Temple — Live Memory Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <img src="/static/img/logo-cloudtemple.svg" alt="Cloud Temple" class="login-logo">
        <h2>Live Memory <span class="login-badge">Admin</span></h2>
        <p class="login-subtitle">Administration console</p>
        <div class="login-form">
            <label for="loginToken">🔑 Access Token</label>
            <input type="password" id="loginToken" placeholder="Paste your token…" autocomplete="off" spellcheck="false" data-1p-ignore data-lpignore="true">
            <div class="login-error" id="loginError"></div>
            <button id="loginBtn">Sign in</button>
        </div>
    </div>
</div>

<!-- HEADER -->
<header class="header">
    <div class="header-brand">
        <img src="/static/img/logo-cloudtemple.svg" alt="Cloud Temple" class="header-logo">
        <span class="header-sep">|</span>
        <h1>Live Memory</h1>
        <span class="header-badge">Admin</span>
        <span class="header-version" id="headerVersion"></span>
    </div>
    <div class="header-right">
        <span class="header-user" id="headerUser"></span>
        <a href="/live" class="header-link">📊 Live</a>
        <button class="btn-logout" id="logoutBtn">🔓</button>
    </div>
</header>

<!-- LAYOUT -->
<div class="admin-layout">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-section" id="sidebarNav"></div>
    </nav>
    <main class="content" id="content">
        <div class="page-loading">Loading…</div>
    </main>
</div>

<script src="/static/js/admin-api.js"></script>
<script src="/static/js/admin-app.js"></script>
</body>
</html>
